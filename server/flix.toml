[package]
version     = "0.1.0"
flix        = "0.76.2"

# ブラウザの UI エディタ画面から叩く常駐 HTTP サーバ。対象ゲームプロジェクト
# (EDITOR_DIR) の project.json / *.ui.json / hitbox.json を読み書きする。
# GL ウィンドウは開かない (headless)。プレビュー描画は engine_tools の
# ソフトラスタライザを使うため依存に含めている。
# engine は 3 分割ではなく全部入りの 1 本を取る (分割リポは公開されていない)。

[dependencies]
"github:ababup1192/flix_game_engine" = { version = "0.34.0", security = "unrestricted" }
