# リリースビルド: macOS の .app (zip) と Windows のポータブル zip を作り、
# タグ (v*) の push なら同じ Release に両方添付する。workflow_dispatch では
# artifact を作るだけ (動作確認用)。
#
# devbox/nix には依存しない:
#   - Flix コンパイラは GitHub releases の flix.jar を版で固定して取得
#     (server/flix.toml の flix = と揃えること)
#   - JDK は zulu 21、node は 22 を actions で入れる
# engine リポが private の場合は、読み取り PAT を ENGINE_REPO_TOKEN として
# リポジトリの Secrets に登録しておく (無ければ既定トークンで試す)。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      engine_version:
        description: "同梱する engine の版 (例 0.35.31)。空ならリポジトリの engine-version"
        required: false
        default: ""

env:
  FLIX_VERSION: "0.77.0"

jobs:
  # 同梱する engine の版を決める。正はリポジトリ直下の engine-version (ゲームの master の
  # flix.toml と同じ版を書く)。workflow_dispatch の入力があればそちらを使う (試しの実行用)。
  # 版が無い・形が違う・engine にそのタグが無ければここで止まる。engine の main の最新は
  # 使わない: ゲームとずれると make と Studio を行き来するたびに全部コンパイルし直しになる。
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.engine.outputs.version }}
      ref: ${{ steps.engine.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - id: engine
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_REPO_TOKEN || github.token }}
          INPUT_VERSION: ${{ inputs.engine_version }}
        run: ci/resolve-engine-version.sh "$INPUT_VERSION"

  # engine の fpkg は engine リポにコミットされていない (gitignore)。作るには
  # symlink + bash の make sync-engine-full が要るので、ubuntu で 1 回だけ焼いて
  # 両 OS のジョブへ配る。
  prepare:
    runs-on: ubuntu-latest
    needs: resolve
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ababup1192/flix_game_engine
          ref: ${{ needs.resolve.outputs.ref }}
          token: ${{ secrets.ENGINE_REPO_TOKEN || github.token }}
      - name: engine の版を照合 (タグと engine_full/flix.toml)
        env:
          WANT: ${{ needs.resolve.outputs.version }}
        run: |
          got="$(sed -n 's/^version *= *"\(.*\)"/\1/p' engine_full/flix.toml)"
          if [ "$got" != "$WANT" ]; then
            echo "::error title=engine の版::タグ v$WANT の engine_full/flix.toml は $got でした"
            exit 1
          fi
          echo "engine_full $got"
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - name: Fetch flix.jar (bin/flix ラッパの最終フォールバック位置)
        run: curl -fL -o bin/flix.jar https://github.com/flix/flix/releases/download/v${{ env.FLIX_VERSION }}/flix.jar
      - name: Build engine_full.fpkg
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make sync-engine-full
      - uses: actions/upload-artifact@v4
        with:
          name: engine-full-fpkg
          path: engine_full/artifact/package.fpkg

  windows:
    runs-on: windows-latest
    needs: [resolve, prepare]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ababup1192/flix_game_engine
          ref: ${{ needs.resolve.outputs.ref }}
          token: ${{ secrets.ENGINE_REPO_TOKEN || github.token }}
          path: engine_repo
      - uses: actions/download-artifact@v4
        with:
          name: engine-full-fpkg
          path: engine_repo/engine_full/artifact
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 検査・要約の道具 (bin/fge) の中身。engine の bin/fge-go.exe は git に入らない
      # (OS ごとに別物のバイナリ) ので、checkout した engine で 1 つ焼く。同梱物の照合と、
      # 産まれたゲームへ入れる分がこれ。
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine_repo/go/go.mod
      - name: Build fge-go (windows/amd64)
        working-directory: engine_repo/go
        run: go build -o ../bin/fge-go.exe .
      - name: Fetch flix.jar
        run: curl -fL -o flix.jar https://github.com/flix/flix/releases/download/v${{ env.FLIX_VERSION }}/flix.jar
      - name: Build server fatjar
        working-directory: server
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # -Xss16m を外すと Windows で落ちる。Flix の型検査は式の深さぶん再帰するので、
        # スレッドの既定スタックが 1MB の Windows では server の規模で溢れる
        # (macOS/arm64 は既定 2MB なので気づけない)。
        run: java -Xss16m -jar ../flix.jar build-fatjar
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Package portable zip
        shell: pwsh
        run: ./ci/package-windows.ps1 -EngineRepo "$PWD/engine_repo" -FlixJar "$PWD/flix.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: FlixGEStudio-windows-x64.zip

  macos:
    runs-on: macos-latest
    needs: [resolve, prepare]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ababup1192/flix_game_engine
          ref: ${{ needs.resolve.outputs.ref }}
          token: ${{ secrets.ENGINE_REPO_TOKEN || github.token }}
          path: engine_repo
      - uses: actions/download-artifact@v4
        with:
          name: engine-full-fpkg
          path: engine_repo/engine_full/artifact
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch flix.jar
        run: curl -fL -o flix.jar https://github.com/flix/flix/releases/download/v${{ env.FLIX_VERSION }}/flix.jar
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      # 検査・要約の道具 (bin/fge) の中身。engine の bin/fge-go は git に入らない
      # (OS ごとに別物のバイナリ) ので、checkout した engine で 1 つ焼く。make test の
      # parity 検査と stage-engine の照合、.app に入れる分がこれ。
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine_repo/go/go.mod
      - name: Build fge-go (darwin)
        working-directory: engine_repo/go
        run: go build -o ../bin/fge-go .
      # ビルド前の関所: server のテストと、AGENTS 配布の二重実装 (engine の
      # bin/fge sync-agents と server の --sync-agents) の一致検査。ここで止めれば
      # 壊れた配布を .app に焼き込まない。engine は checkout 済みの engine_repo を使う。
      - name: make test (flix test + check-agents-parity)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          make test
          ENGINE="$PWD/engine_repo"
          FLIX="java -Xss16m -jar $PWD/flix.jar"
      - name: make app
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          make app
          ENGINE="$PWD/engine_repo"
          FLIX="java -Xss16m -jar $PWD/flix.jar"
          FLIX_JAR="$PWD/flix.jar"
          JLINK="$JAVA_HOME/bin/jlink"
          WEB_NPM=npm
      - name: Zip .app
        # ditto でないと symlink と署名が壊れる (普通の zip は不可)。
        run: ditto -c -k --keepParent "app/src-tauri/target/release/bundle/macos/Flix GE Studio.app" FlixGEStudio-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: FlixGEStudio-macos-arm64.zip

  release:
    needs: [resolve, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-zip/FlixGEStudio-windows-x64.zip
            macos-zip/FlixGEStudio-macos-arm64.zip
          body: |
            同梱の engine: v${{ needs.resolve.outputs.version }}

            ## macOS (Apple Silicon)
            zip を展開して `Flix GE Studio.app` を Applications へ。
            未署名のため初回は **右クリック → 開く** (または `xattr -d com.apple.quarantine`)。

            ## Windows (x64)
            zip を展開して `Flix GE Studio.exe` を実行するだけ (インストール不要)。
            画面が出ないときは WebView2 ランタイムを導入 (同梱の README-windows.txt 参照)。
            ログ: `%LOCALAPPDATA%\FlixGEStudio\logs\`

  # 紹介ページ (GitHub Pages) の「最新版 vX.Y.Z」を新しいリリースに合わせて出し直す。
  # ダウンロードのリンク自体は releases/latest の固定 URL なので、ここが走らなくても
  # 古い版へ落ちることはない (版の表示が 1 つ前のままになるだけ)。
  # release イベントで pages.yml を直に起こせないのは、GITHUB_TOKEN が作った
  # イベントは別のワークフローを起動しない決まりがあるため。呼び出しなら通る。
  pages:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
